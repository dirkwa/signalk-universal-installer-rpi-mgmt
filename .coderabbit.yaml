language: en-US

reviews:
  profile: assertive
  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    # The release PR only bumps the version; dependency bumps come from
    # Dependabot and are checked by CI.
    ignore_title_keywords:
      - 'chore: release'
      - 'build(deps):'
      - 'build(deps-dev):'
      - 'ci(deps):'
    ignore_usernames:
      - 'release-please[bot]'
      - 'dependabot[bot]'
      - 'github-actions[bot]'

  path_filters:
    - '!**/node_modules/**'
    - '!**/package-lock.json'

  high_level_summary_instructions: |
    Write summaries in present tense. Describe what the code does, not
    what it did. Skip filler like "This PR" and go straight to the change.

  path_instructions:
    - path: '**/*'
      instructions: |
        RPI Manager is a Signal K plugin and webapp for Universal Installer
        setups. AGENTS.md lists the contracts it depends on; flag changes
        that break them, in particular any change to the signalk-rpi-stats
        paths it reads (that plugin's paths are not ours to change).

        One logical change per PR: the PR title becomes the release-notes
        line, so flag a PR that would need two lines. Flag any version
        change outside the release PR, any CHANGELOG.md (the Releases page
        is the changelog), echo comments, and AI-attribution lines
        ("Co-Authored-By: Claude", "Generated with ...").

    - path: 'web/**/*.{ts,tsx}'
      instructions: |
        Every REST and WebSocket request goes to the Signal K server the
        page is served from (same origin, root-relative paths). The power
        actions must ask for
        confirmation before they run; flag any path that reboots or
        powers off without it.

    - path: '{plugin,public}/**'
      instructions: |
        Build output, not tracked. Flag any file a PR adds here.

    - path: '.github/workflows/**'
      instructions: |
        npm publishing is OIDC trusted publishing bound to publish.yml.
        Flag NPM_TOKEN or NODE_AUTH_TOKEN, and any move of the publish
        step out of publish.yml.
